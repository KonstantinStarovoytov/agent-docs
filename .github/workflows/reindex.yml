# Daily incremental re-index. Every markdown page in each vendor's llms.txt,
# minus excludes, is indexed: new pages must pass a quality gate, and
# suspicious ones are quarantined in the "Pages waiting for review" issue for
# a human to decide. Pages that vanish from a vendor index are deleted,
# unless the removal guard judges the drop too large to be safe, in which
# case the run fails and an issue is opened so a human decides. Every run
# writes a readable change report to the job summary and to
# reports/docs-changes/, and commits the manifest so git history shows what
# changed when.
#
# The scheduled cron must not touch production (agent_docs_hybrid_v1) with
# the new, ~560-page reindex until the owner opts in: set the repository
# variable FULL_DOCS_LIVE to "true" once production has moved to the full
# index. Until then, scheduled runs only keep the free Qdrant cluster awake;
# a manual workflow_dispatch run (e.g. against agent_docs_hybrid_v2) always
# reindexes.

name: Reindex
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      prune:
        description: "Drop indexed pages no source config selects any more (after editing sources.py)"
        type: boolean
        default: false
      collection:
        description: "Qdrant collection to build (empty = production default)"
        type: string
        default: ""
      gate_report_only:
        description: "Index flagged pages but list them (initial build)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: reindex
jobs:
  reindex:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_API_KEY_FALLBACK: ${{ secrets.COHERE_API_KEY_FALLBACK }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_HYBRID_COLLECTION: ${{ inputs.collection || vars.QDRANT_HYBRID_COLLECTION || 'agent_docs_hybrid_v1' }}
      TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The `main` ruleset requires pull requests; GitHub Actions' own token
          # cannot bypass it in a personal repository, but a deploy key can. The
          # manifest and change-report commit below is pushed with this key.
          ssh-key: ${{ secrets.REINDEX_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - name: Keep Qdrant awake
        if: github.event_name == 'schedule' && vars.FULL_DOCS_LIVE != 'true'
        run: |
          uv run python -c "from src.config import settings; from src.ingestion.ingest import get_qdrant_client; c = get_qdrant_client(); print('index points:', c.count(settings.qdrant_hybrid_collection).count); c.close()"
      - name: Reindex changed pages
        id: reindex
        if: github.event_name != 'schedule' || vars.FULL_DOCS_LIVE == 'true'
        run: |
          set -o pipefail
          uv run python -u -m src.reindex --out out \
            ${{ inputs.prune && '--prune' || '' }} \
            ${{ inputs.gate_report_only && '--gate-report-only' || '' }} 2>&1 | tee reindex.log
      - name: Job summary
        if: always()
        run: '[ -f out/report.md ] && cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Commit manifest
        # Even after a failed smoke check: the index was already rewritten,
        # and the manifest must say so or the next run re-embeds it all again.
        if: always()
        run: |
          set -e
          mkdir -p data/manifests reports/docs-changes
          if git diff --quiet -- data/manifests reports/docs-changes && [ -z "$(git ls-files --others --exclude-standard data/manifests reports/docs-changes)" ]; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests reports/docs-changes
          git commit -m "chore(index): reindex on $(date -u +%F) [skip ci]"
          # main may have moved during the run (a PR merged meanwhile). This step
          # only writes the manifest and the change reports, so rebasing the
          # commit onto the new main is safe; a plain push would be rejected.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Quarantine issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/quarantine.md ] || exit 0
          existing=$(gh issue list --label docs-review --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file out/quarantine.md
          else
            gh label create docs-review --description "New doc pages waiting for a decision" --force
            gh issue create --title "Pages waiting for review" --label docs-review --body-file out/quarantine.md
          fi
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Reindex needs attention ($(date -u +%F))"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          \`\`\`
          $(tail -n 40 reindex.log 2>/dev/null || echo "No reindex log: the run failed before the reindex step. Open the run link for the error.")
          \`\`\`"
          existing=$(gh issue list --label reindex --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create reindex --description "Scheduled re-index needs a human" --force
            gh issue create --title "$title" --label reindex --body "$body"
          fi
